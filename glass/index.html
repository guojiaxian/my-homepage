<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="我的应用导航的毛玻璃视图：沿用原站布局，展示应用状态、端口、部署位置与源码同步。">
  <meta name="theme-color" content="#e9efff">
  <title>我的应用导航 · 毛玻璃视图</title>
  <link rel="stylesheet" href="./assets/glass.css">
  <script>
    (function () {
      var el = document.documentElement;
      el.classList.add('fg-js');
      try {
        var t = localStorage.getItem('fluxglass:theme');
        if (t === 'dark' || t === 'light') el.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="fg-body">
  <a class="fg-skip" href="#fg-main">跳到主要内容</a>

  <div class="fg-ambient" aria-hidden="true">
    <div class="fg-ambient__wash"></div>
    <div class="fg-blob fg-blob--blue"></div>
    <div class="fg-blob fg-blob--violet"></div>
    <div class="fg-blob fg-blob--cyan"></div>
    <div class="fg-blob fg-blob--indigo"></div>
    <div class="fg-ambient__grain"></div>
  </div>

  <div class="fg-app">
    <header class="fg-topbar" id="fg-topbar">
      <div class="fg-topbar__inner">
        <a class="fg-brand" href="/">
          <span class="fg-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="fg-i"><use href="#fg-i-grid"></use></svg>
          </span>
          <span class="fg-brand__name" id="fg-site-name">我的应用导航</span>
        </a>

        <div class="fg-topbar__actions">
          <a class="fg-iconbtn" href="https://github.com/guojiaxian" target="_blank" rel="noopener" title="GitHub 主页" aria-label="GitHub 主页">
            <svg viewBox="0 0 24 24" class="fg-i"><use href="#fg-i-github"></use></svg>
          </a>
          <a class="fg-iconbtn" href="/" title="在主站打开设置面板" aria-label="打开主站设置">
            <svg viewBox="0 0 24 24" class="fg-i"><use href="#fg-i-gear"></use></svg>
          </a>
          <button type="button" class="fg-iconbtn" id="fg-theme" title="切换深色" aria-label="切换深色" aria-pressed="false">
            <svg viewBox="0 0 24 24" class="fg-i fg-i--sun"><use href="#fg-i-sun"></use></svg>
            <svg viewBox="0 0 24 24" class="fg-i fg-i--moon"><use href="#fg-i-moon"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="fg-main" id="fg-main">
      <section class="fg-hero">
        <h1 id="fg-hero-title">我的应用</h1>
        <p class="fg-sub" id="fg-hero-sub">部署在这台服务器上的个人项目，端口与运行状态由服务端定时自动探测。</p>
        <div class="fg-stats">
          <span class="fg-stat-chip"><b id="fg-count-apps">—</b> 个应用</span>
          <span class="fg-stat-chip">
            <span class="fg-stat-dot" id="fg-run-dot"></span>
            <b id="fg-count-running">—</b> 个运行中
          </span>
          <span class="fg-stat-chip" title="按部署位置：内网 / 公网">
            内网 <b class="fg-num-blue" id="fg-count-lan">—</b>
            <span class="fg-stat-sep">·</span>
            公网 <b class="fg-num-amber" id="fg-count-public">—</b>
          </span>
          <span class="fg-stat-chip" title="源码与 GitHub 仓库的同步状态">
            <span class="fg-stat-dot" id="fg-git-dot"></span>
            <span id="fg-git-text">正在读取…</span>
          </span>
        </div>
      </section>

      <div class="fg-toolbar">
        <div class="fg-sortbox">
          <select class="fg-select" id="fg-sort" title="排序方式" aria-label="排序方式">
            <option value="default">排序：手动 / 默认顺序</option>
            <option value="name">排序：名称</option>
            <option value="port">排序：端口</option>
            <option value="status">排序：运行状态</option>
            <option value="git">排序：同步状态</option>
          </select>
          <button type="button" class="fg-iconbtn fg-dirbtn" id="fg-sort-dir" title="切换正序 / 倒序" hidden>↑</button>
          <button type="button" class="fg-iconbtn" id="fg-reset-order" title="清除手动排序，恢复默认顺序" aria-label="清除手动排序" hidden>↺</button>
        </div>

        <div class="fg-segmented" role="tablist" aria-label="视图切换">
          <button type="button" class="is-active" data-view="table" role="tab" aria-selected="true">表格</button>
          <button type="button" data-view="card" role="tab" aria-selected="false">卡片</button>
        </div>

        <button type="button" class="fg-syncbtn" id="fg-sync" title="立即重新探测所有应用：端口、git 同步与远程健康">
          <svg viewBox="0 0 24 24" class="fg-i"><use href="#fg-i-refresh"></use></svg>
          <span id="fg-sync-label">立刻同步</span>
        </button>
        <span class="fg-sync-error" id="fg-sync-error" hidden></span>
      </div>

      <div class="fg-placeholder" id="fg-loading" aria-busy="true">
        <div class="fg-skeleton" style="max-width: 760px"></div>
        <div class="fg-skeleton" style="max-width: 760px"></div>
        <div class="fg-skeleton" style="max-width: 760px"></div>
      </div>

      <div class="fg-placeholder" id="fg-error" hidden>
        <p id="fg-error-text">加载应用数据失败</p>
        <button type="button" class="fg-retry" id="fg-retry">重试</button>
      </div>

      <p class="fg-placeholder" id="fg-empty" hidden>还没有应用，请检查 apps.json</p>

      <div class="fg-table-wrap" id="fg-table-wrap" hidden>
        <table class="fg-app-table" aria-label="应用清单">
          <thead id="fg-thead"></thead>
          <tbody id="fg-tbody"></tbody>
        </table>
      </div>

      <div class="fg-cardgrid" id="fg-card-grid" hidden></div>

      <footer class="fg-footer">
        <span>© <span id="fg-year">2026</span> <span id="fg-site-foot">我的应用导航</span> · 毛玻璃视图</span>
        <span id="fg-probe-text"></span>
      </footer>
    </main>
  </div>

  <svg width="0" height="0" class="fg-sprite" aria-hidden="true" focusable="false">
    <symbol id="fg-i-grid"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="fg-i-github"><g fill="currentColor" stroke="none"><path d="M12 .8C5.7.8.6 5.9.6 12.2c0 5 3.2 9.2 7.7 10.7.6.1.8-.3.8-.5v-1.9c-3 .6-3.7-1.4-3.7-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.8.1-.8.1-.8 1.1.1 1.7 1.1 1.7 1.1 1 1.7 2.6 1.3 3.2.9.1-.7.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.9 0-1.3.5-2.4 1.3-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.3 11.3 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.7 5.6-5.3 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.5-1.5 7.7-5.8 7.7-10.7C23.4 5.9 18.3.8 12 .8Z"/></g></symbol>
    <symbol id="fg-i-gear"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.3M12 18.5v2.3M3.2 12h2.3M18.5 12h2.3M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></g></symbol>
    <symbol id="fg-i-sun"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.2M12 18.8v2.2M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></g></symbol>
    <symbol id="fg-i-moon"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/></g></symbol>
    <symbol id="fg-i-refresh"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-13.5 5.8M4 12a8 8 0 0 1 13.5-5.8"/><path d="M20 4.5v5h-5M4 19.5v-5h5"/></g></symbol>
  </svg>

  <script src="./assets/glass.js" defer></script>
</body>
</html>
